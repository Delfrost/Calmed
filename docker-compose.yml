services:
  postgres:
    image: postgres:16-alpine
    container_name: calmed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: healthcare_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
